<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/schema/security">

<head>
  <meta charset="utf-8">
  <title>じゃんけんゲーム</title>
</head>

<body>
  <!-- Hiと名前表示-->
  <!--<div th:if="${name}">-->
  <div>

    <!-- paramを送りたいときは[[${param}]] {}や[]を忘れない-->
    Hi <div sec:authentication="name"></div>
    <a href="/logout">ログアウト</a>
    <br>
    <div th:if="${entry}">
      エントリー
      <ul>
        <!--entryオブジェクトのentryNoというフィールドを指定している-->
        <!--<li>EntryNo:[[${entry.entryNo}]]</li>-->
        <!--eachは所謂for each．この場合entryオブジェクトのusersフィールドにあるすべてのデータを一通り表示する
            thが指定されているので[]が不要になる-->
        <li th:each="user : ${entry.users}">[[${user}]]</li>
      </ul>
    </div>

    <!--プレイヤー名の情報を画面遷移後も残す-->
    <a th:href="@{/janken/gu(name=${name})}">グー </a>
    <a th:href="@{/janken/choki(name=${name})}">チョキ </a>
    <a th:href="@{/janken/pa(name=${name})}">パー </a>
  </div>

  <div th:if="${result}">
    <p>あなたの手は [[${result.myHand}]]</p>
    <p>相手の手は [[${result.comHand}]]</p>
    <p>結果は [[${result.result}]]</p>
  </div>

</body>

</html>
