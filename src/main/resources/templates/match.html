<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/schema/security">

<head>
  <meta charset="utf-8">
  <title>対戦中</title>
</head>

<body>

  <a href="/logout">ログアウト</a>
  <br>
  <h1>Match</h1>
  <!--プレイヤー名の情報を画面遷移後も残す-->
  <h2>
    <span sec:authentication="name"></span>V.S.[[${username}]]
  </h2>
  <br>
  <!--相手がCPUの時だけ表示する-->
  <div th:if="${username == 'CPU'}">
    <!--二つ以上クエリを置くときは()で囲み、「,」で区切る-->
    <a th:href="@{/fight(id=${id},hand='gu')}">グー </a>
    <a th:href="@{/fight(id=${id},hand='choki')}">チョキ </a>
    <a th:href="@{/fight(id=${id},hand='pa')}">パー </a>
  </div>

  <!--相手がCPU以外の時は、相手の手を待つ画面に遷移する-->
  <div th:unless="${username == 'CPU'}">
    <!--二つ以上クエリを置くときは()で囲み、「,」で区切る-->
    <a th:href="@{/fight(id=${id},hand='gu')}">グー </a>
    <a th:href="@{/fight(id=${id},hand='choki')}">チョキ </a>
    <a th:href="@{/fight(id=${id},hand='pa')}">パー </a>
  </div>

  <div th:if="${result}">
    <p>あなたの手は [[${result.myHand}]]</p>
    <p>相手の手は [[${result.comHand}]]</p>
    <p>結果は [[${result.result}]]</p>
  </div>

  <div>
    <a href="/janken">戻る</a>
  </div>

</body>
